[workspace]
resolver = "2"
members = [
    "crates/delhi-syntax",
    "crates/delhi-core",
    "crates/delhi-mb",
    "crates/delhi-lang",
    "crates/delhi",
    "crates/delhi-gui",
]

[workspace.package]
edition = "2021"
version = "0.1.3"
license = "MIT OR Apache-2.0"
repository = "https://github.com/vasanthsarathy/delhi"
homepage = "https://github.com/vasanthsarathy/delhi"
readme = "README.md"
keywords = ["epistemic", "logic", "planning", "modal", "belief"]
categories = ["science", "command-line-utilities"]
# Raise this only with a CI job proving the new floor: it is the promise that decides
# whether someone on a distribution's Rust can use delhi at all.
rust-version = "1.78"

# delhi's doc comments cite sources in brackets — [T] for the thesis, [KR21], [MBD] — and
# rustdoc reads every one of those as an intra-doc link it cannot resolve. There are 207
# across 45 files; escaping them all would put `\[KR21\]` in the source to satisfy a tool,
# which is the wrong way round. The rest of the docs build stays strict (`-D warnings` in
# CI), so a malformed doc comment or a bad code block still fails.
[workspace.lints.rustdoc]
broken_intra_doc_links = "allow"

# Release profile for the published binaries: one codegen unit and fat LTO buy a
# meaningful amount on a workload that is almost entirely tight loops over bitsets, and
# the artefacts are built once per tag, so the compile time is nobody's problem.
[profile.release]
lto = "fat"
codegen-units = 1
strip = true

# Every internal dependency in one block, so a version bump is this list and nothing else.
# It was previously repeated across six manifests, and the very first bump missed one —
# the entry that carried `optional = true` after the version and so did not match.
[workspace.dependencies]
delhi-syntax = { path = "crates/delhi-syntax", version = "0.1.3" }
delhi-core = { path = "crates/delhi-core", version = "0.1.3" }
delhi-mb = { path = "crates/delhi-mb", version = "0.1.3" }
delhi-lang = { path = "crates/delhi-lang", version = "0.1.3" }
delhi-gui = { path = "crates/delhi-gui", version = "0.1.3" }
tiny_http = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
proptest = "1"
