name: release

on:
  push:
    tags: ["v*"]
  # Lets a release be rehearsed against a branch without minting a tag first. The draft
  # release step is skipped unless a tag is what triggered the run.
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          # Cross-compiled from the Apple-silicon runner. GitHub retired macos-13, the
          # last x86 macOS image, so this job would otherwise queue forever with no
          # runner to claim it. Apple's linker targets both architectures from either
          # host, so the only thing lost is the ability to run what was built — hence
          # `cross`, which skips the smoke test rather than pretending it happened.
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: true
          - target: x86_64-pc-windows-msvc
            os: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # `--locked` so the artefact is built from the committed Cargo.lock. A release that
      # silently picked up a newer dependency would not be the thing that was tested.
      - name: build
        run: cargo build --release --locked -p delhi --target ${{ matrix.target }}

      - name: package
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          [ "$GITHUB_REF_TYPE" = "tag" ] || VERSION="dev"
          NAME="delhi-${VERSION}-${{ matrix.target }}"
          mkdir -p "dist/$NAME"
          BIN="target/${{ matrix.target }}/release/delhi"
          # `if`, not `[ … ] && …`: under `set -e` a false test as the last command of a
          # step fails the step, which on Linux is every run.
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          cp "$BIN" "dist/$NAME/"
          cp README.md CHANGELOG.md LICENSE-MIT LICENSE-APACHE "dist/$NAME/"
          cp -r examples "dist/$NAME/"
          # The Python wrapper ships too: someone who downloads a binary to drive it from
          # a script should not have to clone the repository to find the driver.
          mkdir -p "dist/$NAME/python"
          cp python/delhi.py "dist/$NAME/python/"
          cd dist
          # The archive is what a stranger downloads, so it carries the examples and the
          # licences alongside the binary — a bare executable leaves them with nothing to
          # open and no statement of terms.
          if [[ "${{ matrix.target }}" == *windows* ]]; then
            7z a -tzip "$NAME.zip" "$NAME" >/dev/null
            echo "ASSET=dist/$NAME.zip" >> "$GITHUB_ENV"
          else
            tar czf "$NAME.tar.gz" "$NAME"
            echo "ASSET=dist/$NAME.tar.gz" >> "$GITHUB_ENV"
          fi

      # Proves the packaged binary runs on a clean path before it is offered to anyone.
      # Skipped only where the host cannot execute what it just built.
      - name: smoke test the packaged binary
        if: ${{ !matrix.cross }}
        shell: bash
        run: |
          set -euo pipefail
          cd "$(dirname "$ASSET")"
          DIR="$(basename "$ASSET")"; DIR="${DIR%.zip}"; DIR="${DIR%.tar.gz}"
          BIN="$PWD/$DIR/delhi"
          if [ -f "$BIN.exe" ]; then BIN="$BIN.exe"; fi
          "$BIN" --version
          "$BIN" eval "$DIR/examples/coin_lie.delhi" -f "B[carol] h"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ASSET }}
          if-no-files-found: error

  release:
    name: publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # One checksum file over every archive, so a download can be verified without
      # trusting the page it came from.
      - name: checksums
        run: |
          cd dist
          # `delhi-*`, not `*`: globbing the whole directory risks the checksum file
          # listing itself, depending on when the shell creates the redirect target.
          sha256sum delhi-* > SHA256SUMS
          cat SHA256SUMS

      - name: notes
        run: |
          cat > notes.md <<'NOTES'
          Download the archive for your platform, unpack it, and put `delhi` somewhere on
          your `PATH`. No Rust toolchain needed.

          ```
          delhi check examples/coin_lie.delhi
          delhi gui .                # browser UI over the .delhi files here
          ```

          What changed is in [CHANGELOG.md](https://github.com/vasanthsarathy/delhi/blob/master/CHANGELOG.md).

          Verify a download against `SHA256SUMS`. Or install from crates.io instead:
          `cargo install delhi` — and `cargo install delhi --force` to update later.
          NOTES

      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "delhi $GITHUB_REF_NAME" \
            --notes-file notes.md

  # Publishing to crates.io is what makes `cargo install delhi --force` pick up a new
  # version, so it belongs on the tag alongside the binaries. It runs only after the
  # binaries are built and released: a crates.io version cannot be deleted, only yanked,
  # so it is the last thing to happen and the first thing that would be permanent.
  crates-io:
    name: crates.io
    needs: release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      # `--workspace` publishes all six in dependency order and waits for each to appear
      # in the index, which hand-rolled loops used to get wrong. Skipped entirely if no
      # token is configured, so a tag from a fork or before setup does not fail the run.
      - name: publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          if [ -z "${CARGO_REGISTRY_TOKEN:-}" ]; then
            echo "::warning::CARGO_REGISTRY_TOKEN is not set — skipping crates.io publish"
            exit 0
          fi
          cargo publish --workspace --locked
