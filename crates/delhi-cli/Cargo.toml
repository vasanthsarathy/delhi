[package]
name = "delhi-cli"
description = "Command-line tool for the delhi epistemic model checker"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "delhi"
path = "src/main.rs"

# `gui` is on by default so that an installed `delhi` has `delhi gui` and needs no
# second step. `--no-default-features` builds the CLI with no external dependencies at
# all, which is the build to reach for when the dependency graph is the point.
[features]
default = ["gui"]
gui = ["dep:delhi-gui"]

[dependencies]
delhi-lang.workspace = true
delhi-mb.workspace = true
delhi-syntax.workspace = true
delhi-gui = { workspace = true, optional = true }

[lints]
workspace = true
