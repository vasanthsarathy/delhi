[package]
name = "delhi-gui"
description = "Local browser UI for exploring delhi epistemic models"
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# A library, not a binary. It is reached as `delhi gui`, so that a downloaded `delhi`
# is one file rather than two that have to be kept beside each other.
[lib]
name = "delhi_gui"
path = "src/lib.rs"

[dependencies]
delhi-lang.workspace = true
delhi-mb.workspace = true
delhi-syntax.workspace = true
tiny_http.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
